# Config settings file for the Shipment Management scenario for a CP4BA 26.0.0 "Enterprise"-deployment on an Apollo Environment

# If any value should be overwritten in a specific geo a property with the same name but different value can be specified
# in the geo specific values file (values_GENERAL|AMERICAS|APAC|EMEA.properties)

# ---------- Values most often customized ----------

# Should the artifacts required for the deployment be downloaded from Git or those existing locally be used
enableArtifactDownloadFromGit=true

# GitHub token to use to download solution resources from protected repo
gitHubSolutionDownloadToken=$(globalGitHubToken)$

deployPart_WF=true
deployPart_BAA=true
deployPart_ICN=true
deployPart_ADS=true
deployPart_CPE=true
deployPart_BAI=true

# OS used for the solution
CPETargetOS=§IF($(isCloudPakDeployerDeployment)$)§(DEVOS1)§ELSE§(FNOS1DS)ENDIF§

# information about the wxO instance used
wxoInstanceURL=https://api.dl.watson-orchestrate.ibm.com/instances/20250915-1524-4858-605e-e40de8a07508
wxoAgentEnvironment=draft

# ---------- Values that rarely need to be customized ----------

# Where to print output messages to (values: CONSOLEONLY|FILEONLY|BOTH)
outputMode=BOTHONTHEFLY
# Files to write the output, detailed output, trace, and combined detailed output/trace messages to
outputConsoleFile=deployShipment_$$(cp4baVersion)$$_$$(deploymentType)$$_output.txt
outputDetailedFile=deployShipment_$$(cp4baVersion)$$_$$(deploymentType)$$_detailedOutput.txt
outputTraceFile=deployShipment_$$(cp4baVersion)$$_$$(deploymentType)$$_trace.txt
outputCombinedFile=deployShipment_$$(cp4baVersion)$$_$$(deploymentType)$$_combined.txt
# Create a new file (overwriting an existing one - false) or to append if the file already exists (true)
outputAppend=true

# Path where the resources to be deployed can be found in case different from the directory where this file is located
# (can make reference to $$(cp4baVersion)$$ to define the folder specific to the release of CP4BA)
alternativeRootDirectory=§IF($$(isWindows)$$)§(/)ENDIF§§IF($(isDevEnv)$)§(common-$$(cp4baVersion)$$)§ELSE§(Solution Exports)ENDIF§

# Fully qualified name of an admin user to use for the deployment actions (default name when using rapid deployment scripts and LDAP definition, otherwise needs to be overwritten)
cp4baAdminUserName=cn=cp4badmin,dc=example,dc=com
# Admin group for environment (default name when using rapid deployment scripts and LDAP definition, otherwise needs to be overwritten)
cp4baAdminGroup=cn=cp4badmins,dc=example,dc=com

# Fully qualified name of the group that holds general users (default name when using rapid deployment scripts and LDAP definition, otherwise needs to be overwritten)
generalUsersGroupName=cn=cp4bausers,dc=example,dc=com

wf_cp_emailIDInternal=§IF($$(ISNOTSET(wf_cp_emailID))$$ && $(isLocalMailAvailable)$)§($$(cp4baAdminUsr)$$$(localMailDomain|default=)$)§ELSE§($$(wf_cp_emailID|default=)$$)ENDIF§

# General config options
disableSSLCheck=true
debugString=*=FINEST;com.ibm.dba.swat.cp4ba.tools.ocp.*=INFO;com.ibm.dba.swat.cp4ba.tools.ocp.types.EnvironmentInformation=finest;com.ibm.dba.swat.cp4ba.util.BooleanLogicHandler=INFO;com.ibm.dba.swat.cp4ba.util.ReplacementVarResolver=INFO
customOptions=
statefulBASReq=false
cpeRouteStyle=stateful
expressionLanguageLevel=v2
localLDAPUpdate=direct

downloadResourcesOnly=false
testConnectionsOnly=false

